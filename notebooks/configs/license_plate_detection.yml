project_name: license_plate_detection  # Match your dataset folder name
train_set: train
val_set: val
num_gpus: 1  # Set based on your GPU availability (0 for CPU)

# Mean and std for normalization (use ImageNet defaults unless you have specific requirements)
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]

# Anchor parameters (usually keep defaults)
anchors_scales: '[2 ** 0, 2 ** (1.0 / 3.0), 2 ** (2.0 / 3.0)]'
anchors_ratios: '[(1.0, 1.0), (1.4, 0.7), (0.7, 1.4)]'

# CRITICAL: List all your classes in order matching category_id
# category_id 1 corresponds to first item, category_id 2 to second, etc.
obj_list: ['class1', 'class2', 'class3']  # Replace with YOUR classes