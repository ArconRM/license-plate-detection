
Global:
  use_gpu: true
  epoch_num: 10
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: "ocr_rus_model/"
  save_epoch_step: 1
  evaluation_interval: 1
  pretrained_model: null
  checkpoints: null
  save_inference_dir: "ocr_rus_model//inference"
  character_dict_path: ppocr/utils/dict/russian_plate_dict.txt
  max_text_length: 10
  use_space_char: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: "C:\Users\Artemiy\Documents\Авториа"
    label_file_list: ["C:\Users\Artemiy\Documents\Авториа\train_list.txt"]
  loader:
    shuffle: true
    batch_size_per_card: 64

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: "C:\Users\Artemiy\Documents\Авториа"
    label_file_list: ["C:\Users\Artemiy\Documents\Авториа\val_list.txt"]
  loader:
    shuffle: false
    batch_size_per_card: 32

Architecture:
  model_type: rec
  algorithm: CRNN
  Transform:
  Backbone:
    name: MobileNetV3
    scale: 0.5
    model_name: small
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 96
  Head:
    name: CTCHead
    fc_decay: 0.0004

Loss:
  name: CTCLoss

Optimizer:
  name: Adam
  lr: 0.001
  beta1: 0.9
  beta2: 0.999

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
